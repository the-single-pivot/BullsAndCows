name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # no dependencies to install: the game is vanilla and the tests are node:test
      - run: npm test
      - run: npm run build
      - name: dist is up to date with src
        run: git diff --exit-code -- dist
